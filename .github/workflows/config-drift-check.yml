name: Default Config Drift Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  compare-default-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compare default-config.json with previous release
        run: npm run compare
